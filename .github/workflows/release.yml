name: Build release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win --x64
            artifact: windows
          - os: macos-latest
            args: --mac --x64 --arm64
            artifact: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Check tag matches package version
        shell: bash
        run: node -e "const v=require('./package.json').version; if(!/^\d+\.\d+\.\d+$/.test(v)||process.env.GITHUB_REF_NAME!=='v'+v)throw Error('Tag must match package.json stable version')"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Package without publishing
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest*.yml

  publish-draft:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: artifacts
      - name: Create or update draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft > release.json; then
            node -e "if(!require('./release.json').isDraft)throw Error('Refusing to overwrite a published release; use a new version')"
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "墨隐阅读 $RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" artifacts/* --clobber
